<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CNN Loss & Training Progression Report</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 32px; }
  .container { max-width: 900px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: #0f172a; padding: 14px; border-radius: 8px; border-left: 4px solid #38bdf8; }
  .stat-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
  .stat-value { font-size: 18px; font-weight: bold; color: #f1f5f9; margin-top: 4px; }
  .chart-box { background: #0f172a; border-radius: 8px; padding: 16px; margin-top: 16px; }
  svg { width: 100%; height: auto; display: block; }
  .grid-line { stroke: #334155; stroke-dasharray: 4; stroke-width: 1; }
  .axis-label { fill: #94a3b8; font-size: 11px; font-family: monospace; }
</style>
</head>
<body>
<div class="container">
  <h1>Deterministic Report: CNN Behavior Cloning Loss</h1>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total Epochs</div><div class="stat-value">20</div></div>
    <div class="stat-card"><div class="stat-label">Batch Size</div><div class="stat-value">64</div></div>
    <div class="stat-card"><div class="stat-label">Transitions</div><div class="stat-value">11504</div></div>
    <div class="stat-card"><div class="stat-label">Loss Convergence</div><div class="stat-value">2.384 &rarr; 1.095</div></div>
  </div>

  <div class="chart-box">
    <svg viewBox="0 0 700 280">
      <!-- Grid lines -->
      <line x1="60" y1="30" x2="640" y2="30" class="grid-line" />
      <line x1="60" y1="100" x2="640" y2="100" class="grid-line" />
      <line x1="60" y1="170" x2="640" y2="170" class="grid-line" />
      <line x1="60" y1="250" x2="640" y2="250" stroke="#64748b" stroke-width="1.5" />
      <line x1="60" y1="30" x2="60" y2="250" stroke="#64748b" stroke-width="1.5" />

      <!-- Y Axis labels -->
      <text x="50" y="35" text-anchor="end" class="axis-label">2.38</text>
      <text x="50" y="145" text-anchor="end" class="axis-label">1.74</text>
      <text x="50" y="255" text-anchor="end" class="axis-label">1.10</text>

      <!-- Loss Curve -->
      <polyline fill="none" stroke="#38bdf8" stroke-width="3" points="60.0,30.0 142.9,53.6 225.7,77.5 308.6,105.8 391.4,138.4 474.3,173.1 557.1,213.7 640.0,250.0" />
      <circle cx="60.0" cy="30.0" r="4" fill="#38bdf8"><title>Epoch 1: 2.3836</title></circle><circle cx="142.9" cy="53.6" r="4" fill="#38bdf8"><title>Epoch 2: 2.2453</title></circle><circle cx="225.7" cy="77.5" r="4" fill="#38bdf8"><title>Epoch 3: 2.1054</title></circle><circle cx="308.6" cy="105.8" r="4" fill="#38bdf8"><title>Epoch 4: 1.9399</title></circle><circle cx="391.4" cy="138.4" r="4" fill="#38bdf8"><title>Epoch 5: 1.7488</title></circle><circle cx="474.3" cy="173.1" r="4" fill="#38bdf8"><title>Epoch 6: 1.5453</title></circle><circle cx="557.1" cy="213.7" r="4" fill="#38bdf8"><title>Epoch 7: 1.3077</title></circle><circle cx="640.0" cy="250.0" r="4" fill="#38bdf8"><title>Epoch 8: 1.0952</title></circle>
    </svg>
  </div>
</div>
</body>
</html>
