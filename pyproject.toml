[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kagg"
version = "0.1.0"
description = "Kaggriculture Path B self-play training (DQN / SB3)"
readme = "README.md"
requires-python = ">=3.12"
# Install into conda env `kagg` with uv (never a separate pip venv):
#   KAGG_PY="$(conda info --base)/envs/kagg/bin/python"
#   uv pip install -e . --python "$KAGG_PY"
dependencies = [
  "torch==2.13.0",
  "numpy==2.5.2",
  "gymnasium",
  "kaggle-environments==1.32.7",
  "matplotlib==3.11.1",
  "tqdm==4.70.0",
  "tensorboard==2.21.0",
]

[project.optional-dependencies]
dev = ["pytest", "stable-baselines3"]

[tool.setuptools.packages.find]
where = ["datasets/scottweeden/self-training-code"]
include = ["kaggriculture_rl*"]

[tool.setuptools]
package-dir = {"" = "datasets/scottweeden/self-training-code"}
py-modules = [
  "kaggriculture_adapter",
  "kaggle_env_wrapper",
  "dataset_loader",
  "episode_catalog",
  "path_b_bootstrap",
  "kaggriculture_path_b_rebuild",
  "kaggriculture_self_play_training",
  "kaggriculture_dataset_publish",
  "eval_policy",
  "training_metrics",
  "visualize",
  "notebook_paths",
]

[tool.basedpyright]
include = [
  "kaggriculture-self-training",
  "datasets/scottweeden/self-training-code",
  "scripts",
  "opponents",
]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/checkpoints",
  "**/.git",
  "working/kaggle_episodes",
  "datasets/kaggle",
  "experiments",
]
venvPath = "/Users/sweeden/miniforge3/envs"
venv = "kagg"
pythonVersion = "3.12"
pythonPlatform = "Darwin"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingModuleSource = "warning"
extraPaths = [
  "datasets/scottweeden/self-training-code",
]
executionEnvironments = [
  { root = "kaggriculture-self-training", pythonVersion = "3.12", pythonPlatform = "Darwin", extraPaths = [
    "datasets/scottweeden/self-training-code",
  ] },
  { root = "datasets/scottweeden/self-training-code", pythonVersion = "3.12", pythonPlatform = "Darwin", extraPaths = [
    "datasets/scottweeden/self-training-code",
  ] },
  { root = ".", extraPaths = [
    "datasets/scottweeden/self-training-code",
  ] },
]

# Mirror for tools that only read [tool.pyright]. Keep identical to [tool.basedpyright].
# Note: if pyrightconfig.json exists, it takes precedence over this file for basedpyright.
[tool.pyright]
include = [
  "kaggriculture-self-training",
  "datasets/scottweeden/self-training-code",
  "scripts",
  "opponents",
]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/checkpoints",
  "**/.git",
  "working/kaggle_episodes",
  "datasets/kaggle",
  "experiments",
]
venvPath = "/Users/sweeden/miniforge3/envs"
venv = "kagg"
pythonVersion = "3.12"
pythonPlatform = "Darwin"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingModuleSource = "warning"
extraPaths = [
  "datasets/scottweeden/self-training-code",
]
executionEnvironments = [
  { root = "kaggriculture-self-training", pythonVersion = "3.12", pythonPlatform = "Darwin", extraPaths = [
    "datasets/scottweeden/self-training-code",
  ] },
  { root = "datasets/scottweeden/self-training-code", pythonVersion = "3.12", pythonPlatform = "Darwin", extraPaths = [
    "datasets/scottweeden/self-training-code",
  ] },
  { root = ".", extraPaths = [
    "datasets/scottweeden/self-training-code",
  ] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["datasets/scottweeden/self-training-code"]
